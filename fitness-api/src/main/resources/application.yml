spring:
  application:
    name: fitness-api
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    url: jdbc:mysql://localhost:3306/fitness_ai?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  rabbitmq:
    host: 192.168.56.101
    port: 5672
    username: lin
    password: lin123123
    virtual-host: /
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 10000
          max-interval: 30000
          multiplier: 2
          max-attempts: 10
  kafka:
    bootstrap-servers: 192.168.56.101:9092
    topic:
      file-processing: file-processing-topic1
      dlt: file-processing-dlt
    consumer:
      group-id: file-processing-group
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"
  webflux:
    client:
      max-in-memory-size: 16MB
  codec:
    max-in-memory-size: 16MB

# JWT 配置
jwt:
  secret-key: bGluZml0bmVzc19haS1qd3Qtc2VjcmV0LWtleS0yMDI2
  expiration-time: 86400000

# 服务端口
server:
  port: 8080

# MinIO 配置
minio:
  endpoint: http://192.168.56.101:9000
  access-key: HFAUYVIW08T1KH5BQ1U2
  secret-key: mZzSnTDBCj6ZO5+LtLyszQjYPfTGieBbLajc+rxR
  bucket-name: fitness-files
  image-bucket-name: fitness-images
  video-bucket-name: fitness-videos

# ============================================
# Embedding API 配置（通义千问，用于文档向量化）
# ============================================
