spring:
  application:
    name: fitness-recommendation
    profiles:
      active: dev
      include: common
  datasource:
    url: jdbc:mysql://localhost:3306/fitness_ai?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${redis.host:localhost}
      port: ${redis.port:6379}
      password: ${redis.password:}
      database: ${redis.database:0}
      timeout: ${redis.timeout:5000ms}
      lettuce:
        pool:
          max-active: ${redis.lettuce.pool.max-active:8}
          max-idle: ${redis.lettuce.pool.max-idle:8}
          min-idle: ${redis.lettuce.pool.min-idle:0}

server:
  port: 8085

logging:
  file:
    name: logs/${spring.application.name}/info.log
  level:
    org.lin.fitnessrecommendation: DEBUG

# 推荐算法权重配置（可外部化）
recommendation:
  rule-weight: 0.4
  cf-weight: 0.6
  cf-top-k: 10
  max-recommendations: 10
