spring:
  application:
    name: fitness-user
    profiles:
      active: dev
      include: common  # 引入公共配置
  datasource:
    url: jdbc:mysql://localhost:3306/fitness_ai?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${redis.host:localhost}
      port: ${redis.port:6379}
      password: ${redis.password:}
      database: ${redis.database:0}
      timeout: ${redis.timeout:5000ms}
      lettuce:
        pool:
          max-active: ${redis.lettuce.pool.max-active:8}
          max-idle: ${redis.lettuce.pool.max-idle:8}
          min-idle: ${redis.lettuce.pool.min-idle:0}

server:
  port: 8081  # 每个模块使用不同端口

jwt:
  secret-key: ${jwt.secret-key}

logging:
  file:
    name: logs/${spring.application.name}/info.log
  level:
    org.lin.fitnessuser: DEBUG
